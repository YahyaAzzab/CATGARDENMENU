<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#8BA888" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- SEO -->
    <title>Cat's Garden · Menu | Café à chats – Fès, Maroc</title>
    <meta name="description" content="Découvrez le menu de Cat's Garden, le premier café à chats de Fès. Brunchs, pâtisseries, cafés de spécialité, crêpes, pancakes, pizzas et bien plus dans un cadre chaleureux entouré de chats." />
    <meta name="keywords" content="Cat's Garden, café chat, Fès, Maroc, menu, brunch, pancakes, crêpes, café, restaurant" />

    <!-- Open Graph : l’image doit être une URL https absolue une fois le domaine en ligne. -->
    <meta property="og:title" content="Cat's Garden · Menu" />
    <meta property="og:description" content="Le premier café à chats de Fès – Découvrez notre carte gourmande." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_MA" />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cat's Garden, café à chats à Fès" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cat's Garden · Menu" />
    <meta name="twitter:description" content="Le premier café à chats de Fès – Découvrez notre carte gourmande." />
    <meta name="twitter:image" content="/og.jpg" />
    <meta name="twitter:image:alt" content="Cat's Garden, café à chats à Fès" />

    <!-- Favicon (paw print) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <style>
      html, body { margin: 0; background: #FDF6EC; color: #3E2723; }
      #root { min-height: 100dvh; }
    </style>

    <!-- Latin fonts only. Cairo loads when the guest switches to Arabic. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nunito:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nunito:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
